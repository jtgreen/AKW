[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-wiki"
version = "0.0.0"
description = "Wiki ingestion utilities"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "pypdf>=4.0.0",
  "ocrmypdf>=15.0.0",
]

[tool.setuptools]
py-modules = ["ingest_paper", "batch_ingest"]
