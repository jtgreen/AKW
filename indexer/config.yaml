#
# Indexer configuration for a single deployed wiki.
# `scripts/setup_wiki_interactive.py` rewrites paths/URLs to match your wiki name + domain.
#
wiki_repo_root: "/opt/my-wiki-data/repo"
wiki_base_url: "https://example.com"

openai:
  vector_store_name: "my-wiki-store"
  assistant_name: "my-wiki-assistant"
  vector_store_id: "vs_TBD"   # fill in once you create it

pdf_assets:
  # Local directory where ingest uploads stash PDFs + extracted text (scp target from ingest_paper/batch_ingest)
  local_dir: "/opt/my-wiki-pdfs"
