version: "3.9"

services:
  db:
    image: postgres:14
    container_name: ${WIKI_NAME:-my-wiki}-db
    environment:
      POSTGRES_DB: wiki
      POSTGRES_USER: wikijs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: always
    networks:
      - wiki_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.21
    container_name: ${WIKI_NAME:-my-wiki}-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: always
    networks:
      - wiki_net
    # IMPORTANT: no ports: line → ES is NOT exposed to the internet

  wikijs:
    image: requarks/wiki:latest
    container_name: ${WIKI_NAME:-my-wiki}
    depends_on:
      - db
      - elasticsearch
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: wikijs
      DB_PASS: ${POSTGRES_PASSWORD:-change-me}
      DB_NAME: wiki

      # search
      ES_HOST: http://elasticsearch:9200

    ports:
      - "3000:3000"  # Caddy proxies to this
    restart: always
    networks:
      - wiki_net
    volumes:
      - ${WIKI_DATA_DIR:-/opt/my-wiki-data}:/wiki/data

  ask:
    build:
      context: ../indexer
    container_name: ${WIKI_NAME:-my-wiki}-ask
    environment:
      # pass your key into the container
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WIKI_BASE_URL=${WIKI_BASE_URL:-https://example.com}
    # if you want the app to read config.yaml baked into the image,
    # no volumes are strictly necessary. If you want to override it:
    # volumes:
    #   - /opt/knowledge-wiki/indexer/config.yaml:/app/config.yaml:ro
    restart: always
    networks:
      - wiki_net
    ports:
      - "4000:4000"

volumes:
  dbdata:
  esdata:

networks:
  wiki_net:
    driver: bridge
